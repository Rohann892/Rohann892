<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="400" height="300">
  <defs>
    <style>
      @keyframes rotate3d {
        0% { transform: translate(200px, 150px) rotateX(0deg) rotateY(0deg); }
        100% { transform: translate(200px, 150px) rotateX(360deg) rotateY(360deg); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      .cube { 
        animation: rotate3d 8s infinite linear; 
        transform-style: preserve-3d;
      }
      .particle { animation: float 3s infinite ease-in-out; }
    </style>
  </defs>
  <circle cx="50" cy="50" r="3" fill="#00ff00" class="particle" style="animation-delay: 0s;"/>
  <circle cx="150" cy="80" r="3" fill="#00ff00" class="particle" style="animation-delay: 0.5s;"/>
  <circle cx="300" cy="100" r="3" fill="#00ff00" class="particle" style="animation-delay: 1s;"/>
  <circle cx="350" cy="200" r="3" fill="#00ff00" class="particle" style="animation-delay: 1.5s;"/>
  <circle cx="250" cy="350" r="3" fill="#00ff00" class="particle" style="animation-delay: 2s;"/>
  <g class="cube">
    <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#00ff00" stroke-width="2"/>
    <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="#0099ff" stroke-width="2" opacity="0.5"/>
    <line x1="-40" y1="-40" x2="-35" y2="-35" stroke="#ff00ff" stroke-width="2"/>
    <line x1="40" y1="-40" x2="35" y2="-35" stroke="#ff00ff" stroke-width="2"/>
    <line x1="-40" y1="40" x2="-35" y2="35" stroke="#ff00ff" stroke-width="2"/>
    <line x1="40" y1="40" x2="35" y2="35" stroke="#ff00ff" stroke-width="2"/>
  </g>
  <text x="200" y="280" font-size="24" text-anchor="middle" fill="#00ff00" font-weight="bold">&lt;/&gt;</text>
</svg>
